name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-tests:
    name: Server tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Clean install
        working-directory: server
        run: npm ci --no-audit --no-fund

      - name: Run tests
        working-directory: server
        run: npm test -- --runInBand

  client-build:
    name: Client build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Clean install
        working-directory: client
        run: npm ci --no-audit --no-fund

      - name: Production build
        working-directory: client
        run: npm run build

      # The repository has substantial pre-existing lint debt (293 errors on
      # the initial run). Keep the signal visible without blocking security
      # fixes on an unrelated, repository-wide cleanup. New files are expected
      # to be lint-clean and are checked locally.
      - name: Lint (advisory, existing baseline)
        working-directory: client
        continue-on-error: true
        run: npm run lint
